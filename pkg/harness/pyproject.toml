[project]
name = "codefly-runnable"
version = "0.0.1"
description = "The codefly.runnable.served/v1 harness served by every Python runnable"
requires-python = ">=3.11"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["codefly_runnable"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
